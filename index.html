<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acheii - Marketplace Automotivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --graphite-900: #15161A;
            --graphite-800: #1E2025;
            --graphite-700: #2A2D33;
            --steel: #8B95A1;
            --offwhite: #F2F1ED;
            --orange: #FF5A1F;
            --yellow: #FFC93C;
            --green: #3FBF7F;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--graphite-900);
            color: var(--offwhite);
            line-height: 1.6;
        }
        header {
            background: linear-gradient(180deg, var(--graphite-800) 0%, rgba(30, 32, 37, 0.95) 100%);
            border-bottom: 1px solid var(--graphite-700);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            gap: 24px;
        }
        .logo {
            font-family: 'Oswald', sans-serif;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--orange), var(--yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }
        .search-input {
            flex: 1;
            max-width: 500px;
            background-color: var(--graphite-700);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--offwhite);
            font-size: 14px;
        }
        .cart-btn {
            background: linear-gradient(135deg, var(--orange), #FF7A3F);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        .section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 24px;
        }
        .section-title {
            font-family: 'Oswald', sans-serif;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 32px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }
        .product-card {
            background-color: var(--graphite-800);
            border: 1px solid var(--graphite-700);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--orange);
            box-shadow: 0 20px 40px rgba(255, 90, 31, 0.15);
        }
        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--graphite-700), var(--graphite-800));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .product-image svg {
            width: 100%;
            height: 100%;
        }
        .product-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, var(--orange), #FF7A3F);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
        }
        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .product-category {
            font-size: 11px;
            color: var(--orange);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .product-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .product-rating {
            font-size: 13px;
            color: var(--yellow);
            margin-bottom: 12px;
        }
        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }
        .product-price {
            font-family: 'Oswald', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--yellow);
        }
        .product-add {
            background-color: var(--graphite-700);
            border: none;
            color: var(--offwhite);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
        }
        .product-add:hover {
            background-color: var(--orange);
            color: var(--graphite-900);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">🔥 ACHEII</div>
            <input type="text" class="search-input" id="searchInput" placeholder="Buscar peças, categorias...">
            <button class="cart-btn" id="cartBtn">🛒 Carrinho</button>
        </div>
    </header>

    <section class="section">
        <h2 class="section-title">🔥 Produtos Disponíveis</h2>
        <div class="products-grid" id="productsGrid"></div>
    </section>

    <script>
        console.log('✅ Página carregada');
        
        // Produtos demo
        const products = [
            { id: 1, name: 'Amortecedor Dianteiro Premium', category: 'Suspensão', price: 289.90, badge: 'PROMOÇÃO', rating: 4.8, reviews: 143 },
            { id: 2, name: 'Pastilha de Freio Cerâmica', category: 'Freio', price: 145.50, badge: 'POPULAR', rating: 4.9, reviews: 267 },
            { id: 3, name: 'Alternador 80A Original', category: 'Elétrico', price: 456.00, badge: 'QUALIDADE', rating: 4.7, reviews: 89 },
            { id: 4, name: 'Radiador de Alumínio', category: 'Arrefecimento', price: 567.80, badge: 'NOVO', rating: 4.9, reviews: 134 },
            { id: 5, name: 'Bateria 60Ah Premium', category: 'Energia', price: 389.90, badge: 'CONFIÁVEL', rating: 4.6, reviews: 198 },
            { id: 6, name: 'Disco de Freio Ventilado', category: 'Freio', price: 234.90, badge: 'TOP', rating: 4.8, reviews: 112 },
            { id: 7, name: 'Óleo do Motor 5W-30', category: 'Lubrificantes', price: 45.90, badge: 'PROMOÇÃO', rating: 4.9, reviews: 567 },
            { id: 8, name: 'Filtro de Ar', category: 'Filtros', price: 89.90, badge: 'POPULAR', rating: 4.7, reviews: 234 },
        ];

        // Renderizar produtos
        function renderProducts(filtered = products) {
            console.log('Renderizando', filtered.length, 'produtos');
            const html = filtered.map(p => `
                <div class="product-card">
                    <div class="product-image">
                        <svg viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg">
                            <rect width="300" height="250" fill="#2A2D33"/>
                            <text x="150" y="120" font-size="16" fill="#888" text-anchor="middle">${p.category}</text>
                        </svg>
                        <span class="product-badge">${p.badge}</span>
                    </div>
                    <div class="product-info">
                        <div class="product-category">${p.category}</div>
                        <div class="product-name">${p.name}</div>
                        <div class="product-rating">⭐ ${p.rating} (${p.reviews})</div>
                        <div class="product-footer">
                            <div class="product-price">R$ ${p.price.toFixed(2).replace('.', ',')}</div>
                            <button class="product-add">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('productsGrid').innerHTML = html;
            console.log('✅ Produtos renderizados');
        }

        // Buscar
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = products.filter(p =>
                p.name.toLowerCase().includes(query) ||
                p.category.toLowerCase().includes(query)
            );
            renderProducts(filtered);
        });

        // Carregar ao iniciar
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🎯 Iniciando...');
            renderProducts();
        });
    </script>
</body>
</html>
