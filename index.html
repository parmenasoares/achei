<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acheii - Marketplace Automotivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --graphite-900: #15161A;
            --graphite-800: #1E2025;
            --graphite-700: #2A2D33;
            --steel: #8B95A1;
            --offwhite: #F2F1ED;
            --orange: #FF5A1F;
            --yellow: #FFC93C;
            --green: #3FBF7F;
        }

        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--graphite-900);
            color: var(--offwhite);
            line-height: 1.6;
        }

        /* HEADER */
        header {
            background: linear-gradient(180deg, var(--graphite-800) 0%, rgba(30, 32, 37, 0.95) 100%);
            border-bottom: 1px solid var(--graphite-700);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            gap: 24px;
        }

        .logo {
            font-family: 'Oswald', sans-serif;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--orange), var(--yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .search-container {
            flex: 1;
            max-width: 500px;
        }

        .search-input {
            width: 100%;
            background-color: var(--graphite-700);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--offwhite);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--orange);
            box-shadow: 0 0 20px rgba(255, 90, 31, 0.2);
        }

        .cart-btn {
            background: linear-gradient(135deg, var(--orange), #FF7A3F);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            position: relative;
            transition: all 0.3s ease;
        }

        .cart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 90, 31, 0.3);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--yellow);
            color: var(--graphite-900);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
        }

        /* FILTERS */
        .filters {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--graphite-800);
            border: 2px solid transparent;
            color: var(--steel);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: var(--orange);
            color: var(--orange);
        }

        /* PRODUCTS GRID */
        .section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .section-title {
            font-family: 'Oswald', sans-serif;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 32px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .product-card {
            background-color: var(--graphite-800);
            border: 1px solid var(--graphite-700);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--orange);
            box-shadow: 0 20px 40px rgba(255, 90, 31, 0.15);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--graphite-700), var(--graphite-800));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .product-image svg {
            width: 100%;
            height: 100%;
        }

        .product-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, var(--orange), #FF7A3F);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
        }

        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-category {
            font-size: 11px;
            color: var(--orange);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .product-rating {
            font-size: 13px;
            color: var(--yellow);
            margin-bottom: 12px;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .product-price {
            font-family: 'Oswald', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--yellow);
        }

        .product-add {
            background-color: var(--graphite-700);
            border: none;
            color: var(--offwhite);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .product-add:hover {
            background-color: var(--orange);
            color: var(--graphite-900);
            transform: scale(1.1);
        }

        /* CART MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--graphite-800);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 32px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--offwhite);
            font-size: 28px;
            cursor: pointer;
        }

        .cart-item {
            background-color: var(--graphite-700);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .cart-item-price {
            color: var(--yellow);
            font-weight: 600;
        }

        .cart-item-qty {
            display: flex;
            gap: 8px;
            align-items: center;
            background-color: var(--graphite-800);
            border-radius: 8px;
            padding: 4px 8px;
        }

        .cart-item-qty button {
            background: none;
            border: none;
            color: var(--orange);
            cursor: pointer;
            font-weight: 700;
            width: 24px;
        }

        .cart-summary {
            background-color: var(--graphite-700);
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .cart-total {
            font-size: 18px;
            font-weight: 700;
            color: var(--yellow);
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--graphite-600);
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--orange), #FF7A3F);
            border: none;
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 24px;
            transition: all 0.3s ease;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 90, 31, 0.3);
        }

        .empty-cart {
            text-align: center;
            color: var(--steel);
            padding: 40px 20px;
        }

        /* LOADING */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--steel);
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--graphite-700);
            border-top-color: var(--orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                gap: 12px;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 16px;
            }

            .product-image {
                height: 140px;
            }

            .modal-content {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="logo">🔥 ACHEII</div>
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Buscar peças, categorias...">
            </div>
            <button class="cart-btn" id="cartBtn">
                🛒 Carrinho
                <span class="cart-count" id="cartCount" style="display: none;">0</span>
            </button>
        </div>
    </header>

    <!-- FILTERS -->
    <div class="filters" id="filtersContainer"></div>

    <!-- PRODUCTS -->
    <section class="section">
        <h2 class="section-title" id="sectionTitle">🔥 Produtos Disponíveis</h2>
        <div class="products-grid" id="productsGrid">
            <div class="loading">Carregando produtos...</div>
        </div>
    </section>

    <!-- CART MODAL -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Seu Carrinho</h2>
                <button class="modal-close" id="closeCartBtn">&times;</button>
            </div>
            <div id="cartItemsContainer"></div>
            <div class="cart-summary">
                <div class="cart-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">R$ 0,00</span>
                </div>
                <div class="cart-row">
                    <span>Frete:</span>
                    <span id="shipping">R$ 0,00</span>
                </div>
                <div class="cart-total">
                    Total: <span id="total">R$ 0,00</span>
                </div>
                <button class="checkout-btn">Prosseguir para Checkout</button>
            </div>
        </div>
    </section>

    <script>
        // ==================== SUPABASE CONFIG ====================
        const SUPABASE_URL = 'https://upcizwgxrmzluwhfqcpn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_FBbaBkJ9FPLPTb_vjjlNew_UcrD8z2z';

        let supabase = null;
        let allProducts = [];
        let cart = [];
        let selectedCategory = 'all';

        // Log das credenciais
        console.log('🔧 ACHEII Debug:');
        console.log('URL:', SUPABASE_URL);
        console.log('Chave (primeiros 30 chars):', SUPABASE_ANON_KEY.substring(0, 30) + '...');

        // Tentar conectar ao Supabase
        async function initSupabase() {
            try {
                console.log('📡 Tentando conectar ao Supabase...');
                
                const { createClient } = window.supabase;
                supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('✅ Cliente Supabase criado');

                // Promise que resolve em 5 segundos
                const timeoutPromise = new Promise((resolve) => {
                    setTimeout(() => {
                        console.warn('⏱️ Timeout (5s) - Carregando produtos do Supabase ou usando demo');
                        resolve(null);
                    }, 5000);
                });

                // Correr Supabase e timeout em paralelo
                const result = await Promise.race([
                    loadProductsFromSupabase(),
                    timeoutPromise
                ]);

                // Se chegou aqui e não tem produtos, usar demo
                if (!allProducts || allProducts.length === 0) {
                    console.log('📦 Nenhum produto carregado, usando demo');
                    loadDemoProducts();
                }

            } catch (error) {
                console.error('❌ Erro fatal:', error.message);
                console.log('⚠️ Carregando modo demo');
                loadDemoProducts();
            }
        }

        // ==================== CARREGAR PRODUTOS ====================
        async function loadProductsFromSupabase() {
            try {
                console.log('📥 Carregando produtos do Supabase...');
                const { data, error } = await supabase
                    .from('products')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('❌ Erro Supabase:', error.message);
                    console.error('Erro completo:', error);
                    loadDemoProducts();
                    return;
                }

                if (!data || data.length === 0) {
                    console.warn('⚠️ Nenhum produto encontrado no Supabase');
                    loadDemoProducts();
                    return;
                }

                console.log('✅ Produtos carregados DO SUPABASE:', data.length);
                allProducts = data;
                renderProducts();
                renderFilters();
            } catch (error) {
                console.error('Erro ao carregar Supabase:', error.message);
                console.log('⚠️ Usando modo demo');
                loadDemoProducts();
            }
        }

        function loadDemoProducts() {
            console.log('📦 MODO DEMO: Carregando 8 produtos de teste');
            allProducts = [
                { id: 1, name: 'Amortecedor Dianteiro Premium', category: 'Suspensão', price: 289.90, badge: 'PROMOÇÃO', rating: 4.8, reviews: 143 },
                { id: 2, name: 'Pastilha de Freio Cerâmica', category: 'Freio', price: 145.50, badge: 'POPULAR', rating: 4.9, reviews: 267 },
                { id: 3, name: 'Alternador 80A Original', category: 'Elétrico', price: 456.00, badge: 'QUALIDADE', rating: 4.7, reviews: 89 },
                { id: 4, name: 'Radiador de Alumínio', category: 'Arrefecimento', price: 567.80, badge: 'NOVO', rating: 4.9, reviews: 134 },
                { id: 5, name: 'Bateria 60Ah Premium', category: 'Energia', price: 389.90, badge: 'CONFIÁVEL', rating: 4.6, reviews: 198 },
                { id: 6, name: 'Disco de Freio Ventilado', category: 'Freio', price: 234.90, badge: 'TOP', rating: 4.8, reviews: 112 },
                { id: 7, name: 'Óleo do Motor 5W-30', category: 'Lubrificantes', price: 45.90, badge: 'PROMOÇÃO', rating: 4.9, reviews: 567 },
                { id: 8, name: 'Filtro de Ar', category: 'Filtros', price: 89.90, badge: 'POPULAR', rating: 4.7, reviews: 234 },
            ];
            console.log('✅ Modo demo pronto com', allProducts.length, 'produtos');
            renderProducts();
            renderFilters();
        }

        // ==================== RENDER FILTERS ====================
        function renderFilters() {
            const categories = ['all', ...new Set(allProducts.map(p => p.category))];
            const html = categories.map(cat => `
                <button class="filter-btn ${cat === 'all' ? 'active' : ''}" onclick="filterByCategory('${cat}')">
                    ${cat === 'all' ? '✨ Todos' : cat}
                </button>
            `).join('');
            document.getElementById('filtersContainer').innerHTML = html;
        }

        // ==================== FILTRAR PRODUTOS ====================
        function filterByCategory(category) {
            selectedCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderProducts();
        }

        // ==================== BUSCAR PRODUTOS ====================
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p =>
                p.name.toLowerCase().includes(query) ||
                p.category.toLowerCase().includes(query)
            );
            renderProductsList(filtered);
        });

        // ==================== RENDER PRODUTOS ====================
        function renderProducts() {
            const filtered = selectedCategory === 'all'
                ? allProducts
                : allProducts.filter(p => p.category === selectedCategory);
            renderProductsList(filtered);
        }

        function renderProductsList(products) {
            if (products.length === 0) {
                document.getElementById('productsGrid').innerHTML = '<p class="loading">Nenhum produto encontrado</p>';
                return;
            }

            const html = products.map(p => `
                <div class="product-card">
                    <div class="product-image">
                        <svg viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg">
                            <rect width="300" height="250" fill="#2A2D33"/>
                            <text x="150" y="120" font-size="16" fill="#888" text-anchor="middle" font-family="Arial">${p.category}</text>
                        </svg>
                        <span class="product-badge">${p.badge || 'NOVO'}</span>
                    </div>
                    <div class="product-info">
                        <div class="product-category">${p.category}</div>
                        <div class="product-name">${p.name}</div>
                        <div class="product-rating">⭐ ${p.rating} (${p.reviews})</div>
                        <div class="product-footer">
                            <div class="product-price">R$ ${p.price.toFixed(2).replace('.', ',')}</div>
                            <button class="product-add" onclick="addToCart(${p.id}, '${p.name}', ${p.price})">+</button>
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('productsGrid').innerHTML = html;
        }

        // ==================== CARRINHO ====================
        function addToCart(id, name, price) {
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ id, name, price, qty: 1 });
            }
            saveCart();
            updateCartUI();
            showNotification(`${name} adicionado ao carrinho!`);
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            saveCart();
            updateCartUI();
        }

        function updateQty(id, delta) {
            const item = cart.find(item => item.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) removeFromCart(id);
                saveCart();
                updateCartUI();
            }
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const countEl = document.getElementById('cartCount');
            if (count > 0) {
                countEl.textContent = count;
                countEl.style.display = 'flex';
            } else {
                countEl.style.display = 'none';
            }

            if (cart.length === 0) {
                document.getElementById('cartItemsContainer').innerHTML = '<div class="empty-cart">🛒 Seu carrinho está vazio</div>';
            } else {
                const html = cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">R$ ${item.price.toFixed(2).replace('.', ',')}</div>
                        </div>
                        <div class="cart-item-qty">
                            <button onclick="updateQty(${item.id}, -1)">−</button>
                            <span>${item.qty}</span>
                            <button onclick="updateQty(${item.id}, 1)">+</button>
                            <button onclick="removeFromCart(${item.id})" style="margin-left: 8px; color: #E5484D;">✕</button>
                        </div>
                    </div>
                `).join('');
                document.getElementById('cartItemsContainer').innerHTML = html;
            }

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const shipping = subtotal > 500 ? 0 : 50;
            const total = subtotal + shipping;

            document.getElementById('subtotal').textContent = `R$ ${subtotal.toFixed(2).replace('.', ',')}`;
            document.getElementById('shipping').textContent = shipping === 0 ? 'GRÁTIS' : `R$ ${shipping.toFixed(2).replace('.', ',')}`;
            document.getElementById('total').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function saveCart() {
            localStorage.setItem('acheii_cart', JSON.stringify(cart));
        }

        function loadCart() {
            const saved = localStorage.getItem('acheii_cart');
            cart = saved ? JSON.parse(saved) : [];
            updateCartUI();
        }

        function showNotification(msg) {
            const el = document.createElement('div');
            el.textContent = msg;
            el.style.cssText = `
                position: fixed; bottom: 20px; right: 20px;
                background: var(--orange); color: white;
                padding: 16px 24px; border-radius: 10px;
                z-index: 2000; animation: slideIn 0.3s ease;
            `;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        // ==================== MODAL ====================
        document.getElementById('cartBtn').addEventListener('click', () => {
            document.getElementById('cartModal').classList.add('active');
        });

        document.getElementById('closeCartBtn').addEventListener('click', () => {
            document.getElementById('cartModal').classList.remove('active');
        });

        // ==================== INIT ====================
        window.addEventListener('DOMContentLoaded', () => {
            loadCart();
            initSupabase();
        });
    </script>
</body>
</html>
