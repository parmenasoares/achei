name: Add hero slider

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-hero-slider:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update hero slider
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          hero = r'''<section class="hero hero-slider" id="heroSlider">
            <div class="hero-slides">
              <article class="hero-slide active">
                <div class="hero-inner">
                  <div class="hero-content">
                    <div class="hero-badge">🔎 Encontre rápido</div>
                    <h1>Encontre a peça<br><span>certa</span> para seu carro</h1>
                    <p>Pesquise por veículo, peça ou categoria e encontre as melhores opções em poucos segundos.</p>
                    <div class="hero-actions">
                      <button class="btn-primary" onclick="document.getElementById('catalog-section').scrollIntoView({behavior:'smooth'})">Encontrar Peças</button>
                      <button class="btn-secondary" onclick="goTo('seller')">Ver Vendedores</button>
                    </div>
                    <div class="hero-stats">
                      <div class="stat"><span class="stat-value">12k+</span><span class="stat-label">Produtos</span></div>
                      <div class="stat"><span class="stat-value">98%</span><span class="stat-label">Satisfação</span></div>
                      <div class="stat"><span class="stat-value">24h</span><span class="stat-label">Entrega</span></div>
                    </div>
                  </div>
                  <div class="hero-visual hero-visual-card">
                    <div class="hero-art hero-art-search"><span>🔎</span><strong>PEÇA CERTA</strong><small>para o seu veículo</small></div>
                  </div>
                </div>
              </article>

              <article class="hero-slide">
                <div class="hero-inner">
                  <div class="hero-content">
                    <div class="hero-badge">🔧 Serviços perto de você</div>
                    <h1>Encontre <span>oficinas</span><br>e profissionais</h1>
                    <p>Compare vendedores, descubra oficinas e fale diretamente com quem entende do seu veículo.</p>
                    <div class="hero-actions">
                      <button class="btn-primary" onclick="goTo('seller')">Encontrar Oficina</button>
                      <button class="btn-secondary" onclick="openChat()">Falar com Especialista</button>
                    </div>
                    <div class="hero-stats">
                      <div class="stat"><span class="stat-value">+500</span><span class="stat-label">Oficinas</span></div>
                      <div class="stat"><span class="stat-value">4.9★</span><span class="stat-label">Avaliação</span></div>
                      <div class="stat"><span class="stat-value">24h</span><span class="stat-label">Resposta</span></div>
                    </div>
                  </div>
                  <div class="hero-visual hero-visual-card">
                    <div class="hero-art hero-art-workshop"><span>🔧</span><strong>OFICINAS &amp; ESPECIALISTAS</strong><small>qualidade e confiança</small></div>
                  </div>
                </div>
              </article>

              <article class="hero-slide">
                <div class="hero-inner">
                  <div class="hero-content">
                    <div class="hero-badge">🔥 Ofertas especiais</div>
                    <h1>As melhores<br><span>ofertas</span> automotivas</h1>
                    <p>Economize nas peças que seu carro precisa com ofertas selecionadas e oportunidades todos os dias.</p>
                    <div class="hero-actions">
                      <button class="btn-primary" onclick="document.getElementById('catalog-section').scrollIntoView({behavior:'smooth'})">Ver Ofertas</button>
                      <button class="btn-secondary" onclick="filterAndGo('all')">Explorar Catálogo</button>
                    </div>
                    <div class="hero-stats">
                      <div class="stat"><span class="stat-value">-40%</span><span class="stat-label">Descontos</span></div>
                      <div class="stat"><span class="stat-value">12k+</span><span class="stat-label">Produtos</span></div>
                      <div class="stat"><span class="stat-value">✓</span><span class="stat-label">Garantia</span></div>
                    </div>
                  </div>
                  <div class="hero-visual hero-visual-card">
                    <div class="hero-art hero-art-offer"><span>🏷️</span><strong>OFERTAS</strong><small>preços que cabem no bolso</small></div>
                  </div>
                </div>
              </article>
            </div>
            <button class="hero-nav hero-prev" type="button" aria-label="Slide anterior" onclick="heroSlider.prev()">‹</button>
            <button class="hero-nav hero-next" type="button" aria-label="Próximo slide" onclick="heroSlider.next()">›</button>
            <div class="hero-dots" role="tablist" aria-label="Slides">
              <button class="hero-dot active" type="button" aria-label="Slide 1" onclick="heroSlider.go(0)"></button>
              <button class="hero-dot" type="button" aria-label="Slide 2" onclick="heroSlider.go(1)"></button>
              <button class="hero-dot" type="button" aria-label="Slide 3" onclick="heroSlider.go(2)"></button>
            </div>
          </section>'''

          html, count = re.subn(r'<section class="hero">.*?</section>', hero, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Hero section not found; no changes made.')

          css = r'''
/* ============================
   HERO SLIDER
   ============================ */
.hero-slider{position:relative;isolation:isolate}
.hero-slides{position:relative;min-height:470px}
.hero-slide{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateX(28px);transition:opacity .55s ease,transform .65s ease,visibility .55s;pointer-events:none}
.hero-slide.active{position:relative;opacity:1;visibility:visible;transform:translateX(0);pointer-events:auto}
.hero-slider .hero-inner{min-height:470px}
.hero-visual-card{display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(145deg,#242730,#111216);box-shadow:0 24px 70px rgba(0,0,0,.35)}
.hero-art{width:82%;height:78%;border:1px solid rgba(255,201,60,.2);border-radius:22px;background:linear-gradient(145deg,rgba(255,90,31,.16),rgba(255,201,60,.04));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;box-shadow:inset 0 0 70px rgba(255,90,31,.05)}
.hero-art span{font-size:76px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35));animation:hero-float 3s ease-in-out infinite}
.hero-art strong{font-family:'Oswald',sans-serif;font-size:22px;letter-spacing:1px;color:var(--offwhite)}
.hero-art small{font-size:12px;color:var(--steel)}
.hero-art-workshop{background:linear-gradient(145deg,rgba(74,158,255,.12),rgba(63,191,127,.06))}
.hero-art-offer{background:linear-gradient(145deg,rgba(255,90,31,.2),rgba(255,201,60,.08))}
@keyframes hero-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero-nav{position:absolute;top:50%;z-index:5;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--g600);background:rgba(15,16,19,.72);backdrop-filter:blur(8px);color:var(--offwhite);font-size:34px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .2s}
.hero-nav:hover{background:var(--orange);border-color:var(--orange);transform:translateY(-50%) scale(1.06)}
.hero-prev{left:20px}.hero-next{right:20px}
.hero-dots{position:absolute;bottom:24px;left:50%;z-index:6;transform:translateX(-50%);display:flex;gap:8px}
.hero-dot{width:28px;height:5px;border:0;border-radius:999px;background:rgba(240,239,233,.28);padding:0;transition:all .25s}
.hero-dot.active{width:48px;background:var(--orange)}
.hero-slide .hero-badge,.hero-slide h1,.hero-slide p,.hero-slide .hero-actions,.hero-slide .hero-stats{animation:hero-content-in .65s ease both}
.hero-slide .hero-badge{animation-delay:.05s}.hero-slide h1{animation-delay:.1s}.hero-slide p{animation-delay:.16s}.hero-slide .hero-actions{animation-delay:.22s}.hero-slide .hero-stats{animation-delay:.28s}
@keyframes hero-content-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media (max-width:767px){
  .hero-slides,.hero-slider .hero-inner{min-height:560px}
  .hero-slide .hero-inner{padding:42px 48px 64px 16px}
  .hero-slider .hero-visual{display:flex;width:100%;height:170px}
  .hero-art{width:92%;height:82%}.hero-art span{font-size:48px}.hero-art strong{font-size:17px}
  .hero-nav{width:36px;height:36px;font-size:28px}.hero-prev{left:8px}.hero-next{right:8px}
  .hero-dots{bottom:18px}.hero-dot{width:22px}.hero-dot.active{width:38px}
}
@media (prefers-reduced-motion:reduce){.hero-slide,.hero-art span{animation:none!important;transition:none!important}}
'''

          style_marker = '</style>'
          html = html.replace(style_marker, css + '\n' + style_marker, 1)

          js = r'''
// ============================
// HERO SLIDER
// ============================
const heroSlider = (() => {
  const root = document.getElementById('heroSlider');
  if (!root) return {next(){},prev(){},go(){}};
  const slides = [...root.querySelectorAll('.hero-slide')];
  const dots = [...root.querySelectorAll('.hero-dot')];
  let index = 0;
  let timer = null;
  let startX = 0;
  let paused = false;

  const render = (nextIndex) => {
    index = (nextIndex + slides.length) % slides.length;
    slides.forEach((slide, i) => slide.classList.toggle('active', i === index));
    dots.forEach((dot, i) => {
      dot.classList.toggle('active', i === index);
      dot.setAttribute('aria-selected', i === index ? 'true' : 'false');
    });
  };
  const start = () => {
    clearInterval(timer);
    timer = setInterval(() => { if (!paused) render(index + 1); }, 5500);
  };
  const next = () => { render(index + 1); start(); };
  const prev = () => { render(index - 1); start(); };
  const go = (i) => { render(i); start(); };

  root.addEventListener('mouseenter', () => paused = true);
  root.addEventListener('mouseleave', () => paused = false);
  root.addEventListener('focusin', () => paused = true);
  root.addEventListener('focusout', () => paused = false);
  root.addEventListener('touchstart', e => { startX = e.changedTouches[0].clientX; paused = true; }, {passive:true});
  root.addEventListener('touchend', e => {
    const delta = e.changedTouches[0].clientX - startX;
    paused = false;
    if (Math.abs(delta) > 45) delta < 0 ? next() : prev();
  }, {passive:true});
  document.addEventListener('keydown', e => {
    if (!root.matches(':hover') && document.activeElement?.closest('#heroSlider') === null) return;
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });

  render(0);
  start();
  return {next,prev,go};
})();
'''

          script_marker = '</script>'
          html = html.replace(script_marker, js + '\n' + script_marker, 1)
          path.write_text(html, encoding='utf-8')
      
      - name: Commit hero slider
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add three hero slider slides"
          git push